replicaCount: 1

image:
  tag: latest
  pullPolicy: IfNotPresent

autoscaling:
  enabled: false

pdb:
  enabled: false

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1
    memory: 1Gi

ingress:
  enabled: false

database:
  host: postgres-dev
  port: 5432
  name: syncflow

encryption:
  existingSecret: syncflow-encryption
  key: key
