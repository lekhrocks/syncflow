apiVersion: v1
kind: Service
metadata:
  name: {{ include "syncflow.fullname" . }}
  labels:
    {{- include "syncflow.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: {{ include "syncflow.name" . }}
