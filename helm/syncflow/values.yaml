global:
  region: us-east-1
  multiRegion:
    enabled: true
    primary: us-east-1
    replicas:
      us-east-1: 3
      eu-west-1: 2
      ap-southeast-1: 2

replicaCount: 3

serviceAccount:
  create: true
  annotations: {}

image:
  repository: ghcr.io/lekhrocks/syncflow
  tag: latest
  pullPolicy: IfNotPresent

podAnnotations: {}

podSecurityContext:
  fsGroup: 2000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000

database:
  host: postgres
  port: 5432
  name: syncflow
  existingSecret: syncflow-db

encryption:
  existingSecret: syncflow-encryption
  key: key

env: []

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1
    memory: 1Gi

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: syncflow.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15

keda:
  enabled: true
  pollingInterval: 15
  cooldownPeriod: 60
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-server:9090
        metricName: syncflow_queue_depth
        query: sum(syncflow_workflow_queue_size)
        threshold: "100"
    - type: cpu
      metadata:
        type: Utilization
        value: "60"

podDisruptionBudget:
  enabled: true
  minAvailable: 1

pdb:
  enabled: true
  minAvailable: 1

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - syncflow
          topologyKey: kubernetes.io/hostname
  podTopologySpread:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule

disasterRecovery:
  enabled: true
  backupSchedule: "0 */4 * * *"
  backupRetention: "30d"
  crossRegionReplication: true
  restoreWorkflow:
    enabled: true
    validation: true

rollingUpdate:
  maxSurge: 1
  maxUnavailable: 0

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  initialDelaySeconds: 15
  periodSeconds: 5
  failureThreshold: 2

startupProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 5
  failureThreshold: 30

serviceMonitor:
  enabled: true
  interval: 15s
  scrapeTimeout: 10s
