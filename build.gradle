plugins {
    id "java"
    id "com.diffplug.spotless" version "7.0.2"
    id "org.owasp.dependencycheck" version "12.2.2"
}

group = "com.syncflow"
version = "0.1.0"

spotless {
    java {
        target "*/src/**/*.java"
        trimTrailingWhitespace()
        endWithNewline()
        removeUnusedImports()
        eclipse().configFile(rootProject.file("gradle/eclipse-formatter.xml"))
    }
}

// ──────────────────────────────────────────────
//  Dependency resolution
// ──────────────────────────────────────────────

subprojects {
    configurations.configureEach {
        resolutionStrategy {
            // CVE-2025-67030: plexus-utils directory traversal in extractFile.
            // Pushed transitively by Debezium → maven-artifact; force the patched line.
            force "org.codehaus.plexus:plexus-utils:3.6.1"
            // CVE-2026-59949: lz4-java native XXHash can crash the JVM on invalid
            // byte-array ranges. Pushed transitively by Kafka clients; force patched.
            force "at.yawk.lz4:lz4-java:1.11.1"
        }
    }
}

// ──────────────────────────────────────────────
//  OWASP Dependency-Check
// ──────────────────────────────────────────────

dependencyCheck {
    failBuildOnCVSS = 9           // only fail on critical (CVSS >= 9)
    suppressionFile = "gradle/dependency-check-suppressions.xml"
    nvd {
        apiKey = System.getenv("NVD_API_KEY") ?: ""
    }
    analyzers {
        nodeAuditEnabled = false   // handled separately by npm audit
        retirejs { enabled = false }
    }
    formats = ["HTML", "SARIF"]
    outputDirectory = layout.buildDirectory.dir("reports/dependency-check").get().asFile
}

// ──────────────────────────────────────────────
//  Developer Experience Tasks
// ──────────────────────────────────────────────

tasks.register("verify") {
    group = "syncflow"
    description = "Full verification: format check + compile + all unit tests"
    dependsOn "spotlessCheck", "compileJava"
    dependsOn ":syncflow-core:test", ":syncflow-api:test", ":syncflow-connectors:test"
    doLast { println "✅ verify complete" }
}

tasks.register("benchmark") {
    group = "syncflow"
    description = "Run JMH microbenchmarks"
    dependsOn ":syncflow-core:jmh"
    doLast { println "✅ benchmark complete" }
}

tasks.register("integrationTest") {
    group = "syncflow"
    description = "Run Testcontainers integration tests (requires Docker)"
    dependsOn ":syncflow-api:test", ":syncflow-connectors:test"
    mustRunAfter ":syncflow-api:test"
}

tasks.register("smokeTest", Exec) {
    group = "syncflow"
    description = "Spin up Docker, run migration + smoke tests, tear down"
    commandLine "bash", "-c", """
        set -e
        echo "🚀 Starting PostgreSQL..."
        docker compose -f docker/docker-compose.yml up -d postgres
        echo "⏳ Waiting for PostgreSQL..."
        sleep 10
        echo "🧪 Running smoke tests..."
        ./gradlew :syncflow-api:test --tests "*IntegrationTest*" -Dtests.integration=true
        echo "🧹 Tearing down..."
        docker compose -f docker/docker-compose.yml down
        echo "✅ smoke test complete"
    """
}

tasks.register("e2eTest", Exec) {
    group = "syncflow"
    description = "Full end-to-end: spin up, run all tests, tear down"
    commandLine "bash", "-c", """
        set -e
        echo "🚀 Starting full environment..."
        docker compose -f docker/docker-compose.yml up -d
        echo "⏳ Waiting for services..."
        sleep 20
        echo "🧪 Running all tests..."
        ./gradlew test -Dtests.integration=true
        echo "🧹 Tearing down..."
        docker compose -f docker/docker-compose.yml down -v
        echo "✅ e2e test complete"
    """
}

tasks.register("chaosTest") {
    group = "syncflow"
    description = "Run chaos experiments (requires K8s + LitmusChaos)"
    doLast {
        println "⚠️  chaosTest requires a Kubernetes cluster with LitmusChaos."
        println "   Apply: kubectl apply -f scripts/chaos/experiment.yaml"
        println "   Watch: kubectl get chaosengine -n syncflow -w"
    }
}

tasks.register("dev") {
    group = "syncflow"
    description = "Start local development environment"
    doLast {
        println "✅ Local dev setup:"
        println "   1. Start PostgreSQL:  docker compose -f docker/docker-compose.yml up -d postgres"
        println "   2. Start API:         ./gradlew :syncflow-api:bootRun --args='--spring.profiles.active=local'"
        println "   3. Start UI:          cd syncflow-ui && npm run dev"
    }
}

subprojects {
    apply plugin: "java-library"

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.compilerArgs.add("--enable-preview")
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        jvmArgs("--enable-preview")
        // forward the CI/local flag so @EnabledIfSystemProperty integration tests actually run
        systemProperty("tests.integration", System.getProperty("tests.integration", "false"))
        // Docker Desktop 4.84+ rejects docker-java's default API negotiation (min 1.40);
        // pin the API version so Testcontainers can talk to the local daemon.
        systemProperty("api.version", System.getenv().getOrDefault("DOCKER_API_VERSION", "1.40"))
    }
}
