apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: syncflow-dev
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
      name: syncflow
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "250m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "256Mi"
