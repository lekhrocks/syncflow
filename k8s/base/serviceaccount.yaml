apiVersion: v1
kind: ServiceAccount
metadata:
  name: syncflow
  namespace: syncflow
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: syncflow
  namespace: syncflow
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: syncflow
  namespace: syncflow
subjects:
  - kind: ServiceAccount
    name: syncflow
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: syncflow
