apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: syncflow
  namespace: syncflow
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - syncflow.example.com
      secretName: syncflow-tls
  rules:
    - host: syncflow.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: syncflow
                port:
                  number: 8080
