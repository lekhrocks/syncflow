[versions]
spring-boot = "3.5.3"
spring-dependency-management = "1.1.7"
spring-modulith = "1.4.2"
spring-security = "6.5.4"
spring-graphql = "1.4.2"
springdoc = "2.8.6"
lombok = "1.18.38"
mapstruct = "1.6.3"
mapstruct-processor = "1.6.3"
jackson = "2.18.3"
micrometer = "1.15.5"
opentelemetry = "2.15.0"
testcontainers = "1.20.6"
kafka = "3.9.0"
mongodb-driver = "5.4.0"
debezium = "3.1.0.Final"
kotlin = "2.2.0"
kotlin-plugin-spring = "2.1.20"
flyway = "11.7.2"
hibernate-validator = "8.0.2.Final"
logback = "1.5.18"
guava = "33.4.8-jre"
awaitility = "4.3.0"

[libraries]
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-graphql = { module = "org.springframework.boot:spring-boot-starter-graphql" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-modulith-starter-core = { module = "org.springframework.modulith:spring-modulith-starter-core" }
spring-modulith-starter-test = { module = "org.springframework.modulith:spring-modulith-test" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }
spring-doc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }

lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct-processor" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson" }

micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus", version.ref = "micrometer" }
opentelemetry-spring-boot-starter = { module = "io.opentelemetry.javaagent:opentelemetry-javaagent", version.ref = "opentelemetry" }

postgresql = { module = "org.postgresql:postgresql", version = "42.7.5" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
h2 = { module = "com.h2database:h2", version = "2.3.232" }

testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }

kafka-clients = { module = "org.apache.kafka:kafka-clients", version.ref = "kafka" }
mongodb-driver-sync = { module = "org.mongodb:mongodb-driver-sync", version.ref = "mongodb-driver" }
mysql-connector-j = { module = "com.mysql:mysql-connector-j", version = "9.2.0" }
debezium-embedded = { module = "io.debezium:debezium-embedded", version.ref = "debezium" }
debezium-connector-postgres = { module = "io.debezium:debezium-connector-postgres", version.ref = "debezium" }
debezium-connector-mysql = { module = "io.debezium:debezium-connector-mysql", version.ref = "debezium" }

hibernate-validator = { module = "org.hibernate.validator:hibernate-validator", version.ref = "hibernate-validator" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
awaitility = { module = "org.awaitility:awaitility", version.ref = "awaitility" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version = "5.12.2" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version = "1.12.2" }
mockito-core = { module = "org.mockito:mockito-core", version = "5.17.0" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version = "5.17.0" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version = "1.4.2" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-plugin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin-plugin-spring" }
