name: Build, Test, Security Scan & Deploy

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * *'   # nightly at 2am UTC
  workflow_dispatch:        # manual trigger from GitHub UI

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  JAVA_VERSION: '25'
  NODE_VERSION: '20'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'
      - uses: gradle/actions/setup-gradle@v6

      - name: Spotless Check
        run: ./gradlew spotlessCheck

      - name: ESLint (TypeScript)
        run: cd syncflow-ui && npm ci && npm run lint
        continue-on-error: true

  compile:
    name: Compile
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: syncflow-ui/package-lock.json

      - name: Compile Java
        run: ./gradlew compileJava -x :syncflow-api:bootJar

      - name: TypeScript Build
        run: |
          cd syncflow-ui && npm ci && npx tsc --noEmit && npx vite build

  unit-tests:
    name: Unit Tests
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'
      - uses: gradle/actions/setup-gradle@v6

      - name: Core Unit Tests
        run: ./gradlew :syncflow-core:test :syncflow-common:test

      - name: API Unit Tests
        run: ./gradlew :syncflow-api:test -x :syncflow-api:bootJar

      - name: Connectors Unit Tests
        run: ./gradlew :syncflow-connectors:test

      - name: Plugin API Unit Tests
        run: ./gradlew :syncflow-plugin-api:test

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/test/
            **/build/test-results/test/
          retention-days: 7

  arch-tests:
    name: Architecture Tests
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'
      - uses: gradle/actions/setup-gradle@v6

      - name: ArchUnit Tests
        run: ./gradlew :syncflow-api:test --tests "*ArchitectureTest*"

      - name: Upload ArchUnit Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: archunit-reports
          path: syncflow-api/build/reports/tests/test/
          retention-days: 7

  integration-tests:
    name: Integration Tests
    needs: unit-tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: syncflow
          POSTGRES_USER: syncflow
          POSTGRES_PASSWORD: syncflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'
      - uses: gradle/actions/setup-gradle@v6

      - name: Integration Tests (Testcontainers)
        run: |
          ./gradlew :syncflow-api:test -Dtests.integration=true \
            --tests "*IntegrationTest*" \
            --tests "*MetadataIntegrationTest*" \
            --tests "*PipelineApiIntegrationTest*"

      - name: Upload Integration Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-reports
          path: |
            syncflow-api/build/reports/tests/test/
            syncflow-api/build/test-results/test/
          retention-days: 7

  mutation-tests:
    name: Mutation Testing
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'
      - uses: gradle/actions/setup-gradle@v6

      - name: PIT Mutation Tests (Core)
        run: ./gradlew :syncflow-core:pitest
        continue-on-error: true

      - name: Upload PIT Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pitest-reports
          path: syncflow-core/build/reports/pitest/
          retention-days: 7

  performance-tests:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'                         # fix #8: cache gradle deps
      - uses: gradle/actions/setup-gradle@v6
      - uses: grafana/setup-k6-action@v1

      - name: JMH Benchmarks
        run: ./gradlew :syncflow-core:jmh
        continue-on-error: true

      - name: Upload JMH Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jmh-results
          path: syncflow-core/build/reports/jmh/
          retention-days: 30

      - name: k6 Smoke Test
        run: k6 run k6/benchmark.js --vus 10 --duration 30s
        continue-on-error: true

  security-scan:
    name: Security Scan
    needs: compile
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Cache NVD database
        uses: actions/cache@v6
        with:
          path: ~/.gradle/dependency-check-data
          key: nvd-${{ runner.os }}-${{ hashFiles('**/build.gradle') }}
          restore-keys: |
            nvd-${{ runner.os }}-

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'
      - uses: gradle/actions/setup-gradle@v6

      - name: Dependency Check
        run: ./gradlew dependencyCheckAnalyze
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        continue-on-error: true

      - name: Upload Dependency Check Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-reports
          path: build/reports/dependency-check/
          retention-days: 30

  docker-build:
    name: Docker Build + SBOM
    needs: [unit-tests, security-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
      COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'
      - uses: gradle/actions/setup-gradle@v6

      - name: Build Fat JAR
        run: ./gradlew :syncflow-api:bootJar -x test

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Build and Push Docker Image
        id: build-image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          provenance: true
          sbom: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Container Vulnerability Scan
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}'
          format: 'sarif'
          output: 'container-scan.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Container Scan
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'container-scan.sarif'

      - name: Cosign image signature
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v4.1.2
      - name: Sign container image
        if: github.event_name != 'pull_request'
        run: |
          cosign sign --yes \
            --key env://COSIGN_PRIVATE_KEY \
            ${{ steps.build-image.outputs.digest }}
      - name: Verify image signature
        if: github.event_name != 'pull_request'
        run: |
          cosign verify \
            --key env://COSIGN_PUBLIC_KEY \
            ${{ steps.build-image.outputs.digest }}

  helm-validate:
    name: Helm Validation
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Helm
        uses: azure/setup-helm@v5

      - name: Lint Helm Chart
        run: helm lint helm/syncflow

      - name: Template Helm Chart (dev)
        run: helm template syncflow helm/syncflow --values helm/syncflow/ci/dev-values.yaml > /dev/null

      - name: Template Helm Chart (prod)
        run: helm template syncflow helm/syncflow --values helm/syncflow/ci/prod-values.yaml > /dev/null

  deploy-staging:
    name: Deploy to Staging
    needs: [docker-build, integration-tests, helm-validate]
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7

      - name: Setup kubectl
        uses: azure/setup-kubectl@v5

      - name: Deploy to Staging
        run: |
          kubectl apply -k k8s/overlays/dev -n syncflow-staging
          kubectl rollout status deployment syncflow -n syncflow-staging --timeout=120s

      - name: Notify staging failure
        if: failure()
        uses: slackapi/slack-github-action@v4
        with:
          payload: |
            {
              "text": "⚠️ Staging deployment failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  smoke-tests:
    name: Smoke Tests
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - name: Health Check
        run: |
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://staging.syncflow.example.com/actuator/health)
            if [ "$STATUS" == "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed after 10 retries"
          exit 1

      - name: API Smoke Test
        run: |
          curl -sf https://staging.syncflow.example.com/api/health | jq '.status == "UP"'
          curl -sf https://staging.syncflow.example.com/api/connections | jq 'type == "array"'
          curl -sf https://staging.syncflow.example.com/api/pipelines | jq 'type == "array"'
          curl -sf https://staging.syncflow.example.com/api/dashboard/overview | jq '.pipelines | length >= 0'

  deploy-prod:
    name: Deploy to Production
    needs: [docker-build, security-scan, helm-validate, integration-tests]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://syncflow.example.com
    steps:
      - uses: actions/checkout@v7

      - name: Setup kubectl
        uses: azure/setup-kubectl@v5

      - name: Deploy to Production
        id: deploy
        run: |
          kubectl set image deployment/syncflow -n syncflow-prod \
            syncflow=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          kubectl rollout status deployment syncflow -n syncflow-prod --timeout=300s

      - name: Production Smoke Check
        run: |
          sleep 30
          curl -sf https://syncflow.example.com/actuator/health | jq '.status == "UP"'
          echo "Production deployment complete"

      - name: Notify prod success
        if: success()
        uses: slackapi/slack-github-action@v4
        with:
          payload: |
            {
              "text": "✅ Production deployment succeeded: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      # fix #9: notify on prod failure
      - name: Notify prod failure
        if: failure()
        uses: slackapi/slack-github-action@v4
        with:
          payload: |
            {
              "text": "❌ Production deployment failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
