name: Build, Test, Security Scan & Deploy

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  JAVA_VERSION: '25'
  NODE_VERSION: '20'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4

      - name: Spotless Check
        run: ./gradlew spotlessCheck

      - name: ESLint (TypeScript)
        run: cd syncflow-ui && npx eslint src/ --max-warnings=0
        continue-on-error: true

  compile:
    name: Compile
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: syncflow-ui/package-lock.json

      - name: Compile Java
        run: ./gradlew compileJava -x :syncflow-api:bootJar

      - name: TypeScript Build
        run: |
          cd syncflow-ui && npm ci && npx tsc --noEmit && npx vite build

  unit-tests:
    name: Unit Tests
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4

      - name: Core Unit Tests
        run: ./gradlew :syncflow-core:test :syncflow-common:test

      - name: API Unit Tests
        run: ./gradlew :syncflow-api:test -x :syncflow-api:bootJar

      - name: Connectors Unit Tests
        run: ./gradlew :syncflow-connectors:test

      - name: Plugin API Unit Tests
        run: ./gradlew :syncflow-plugin-api:test

  arch-tests:
    name: Architecture Tests
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4

      - name: ArchUnit Tests
        run: ./gradlew :syncflow-api:test --tests "*ArchitectureTest*"

  integration-tests:
    name: Integration Tests
    needs: unit-tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: syncflow
          POSTGRES_USER: syncflow
          POSTGRES_PASSWORD: syncflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4

      - name: Integration Tests (Testcontainers)
        run: |
          ./gradlew :syncflow-api:test -Dtests.integration=true \
            --tests "*IntegrationTest*" \
            --tests "*MetadataIntegrationTest*" \
            --tests "*PipelineApiIntegrationTest*"

  mutation-tests:
    name: Mutation Testing
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4

      - name: PIT Mutation Tests (Core)
        run: |
          ./gradlew :syncflow-core:pitest
        continue-on-error: true

  performance-tests:
    name: Performance Benchmarks
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - uses: grafana/setup-k6-action@v1

      - name: JMH Benchmarks
        run: ./gradlew :syncflow-core:jmh
        continue-on-error: true

      - name: k6 Smoke Test
        run: k6 run k6/benchmark.js --vus 10 --duration 30s
        continue-on-error: true

  security-scan:
    name: Security Scan
    needs: compile
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Dependency Check
        run: ./gradlew dependencyCheckAnalyze
        continue-on-error: true

  docker-build:
    name: Docker Build + SBOM
    needs: [unit-tests, security-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build Fat JAR
        run: ./gradlew :syncflow-api:bootJar -x test

      - name: Generate SBOM
        run: |
          # CycloneDX Gradle plugin
          ./gradlew cyclonedxBom || true
          # Also use Trivy for container-level SBOM
          trivy filesystem --format cyclonedx --output sbom.cdx.json .

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.labels['org.opencontainers.image.created'] }}

      - name: Container Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}'
          format: 'sarif'
          output: 'container-scan.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Container Scan
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'container-scan.sarif'

      - name: Cosign image signature
        uses: sigstore/cosign-installer@v3
      - name: Sign container image
        run: |
          cosign sign --yes \
            --key env://COSIGN_PRIVATE_KEY \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        continue-on-error: true

  helm-validate:
    name: Helm Validation
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm Chart
        run: helm lint helm/syncflow

      - name: Template Helm Chart (dev)
        run: helm template syncflow helm/syncflow --values helm/syncflow/ci/dev-values.yaml > /dev/null

      - name: Template Helm Chart (prod)
        run: helm template syncflow helm/syncflow --values helm/syncflow/ci/prod-values.yaml > /dev/null

  deploy-staging:
    name: Deploy to Staging
    needs: [docker-build, integration-tests, helm-validate]
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Deploy to Staging
        run: |
          kubectl apply -k k8s/overlays/dev -n syncflow-staging
          kubectl rollout status deployment syncflow -n syncflow-staging --timeout=120s

  smoke-tests:
    name: Smoke Tests
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - name: Health Check
        run: |
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://staging.syncflow.example.com/actuator/health)
            if [ "$STATUS" == "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed after 10 retries"
          exit 1

      - name: API Smoke Test
        run: |
          curl -sf https://staging.syncflow.example.com/api/health | jq '.status == "UP"'
          curl -sf https://staging.syncflow.example.com/api/connections | jq 'type == "array"'
          curl -sf https://staging.syncflow.example.com/api/pipelines | jq 'type == "array"'
          curl -sf https://staging.syncflow.example.com/api/dashboard/overview | jq '.pipelines | length >= 0'

  deploy-prod:
    name: Deploy to Production
    needs: [smoke-tests, security-scan, performance-tests]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://syncflow.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Deploy to Production
        id: deploy
        run: |
          kubectl set image deployment/syncflow -n syncflow-prod \
            syncflow=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          kubectl rollout status deployment syncflow -n syncflow-prod --timeout=300s

      - name: Production Smoke Check
        run: |
          sleep 30
          curl -sf https://syncflow.example.com/actuator/health | jq '.status == "UP"'
          echo "Production deployment complete"

      - name: Notify on failure
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "❌ Production deployment failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
