apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: syncflow
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/syncflow
    targetRevision: HEAD
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: syncflow-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
  revisionHistoryLimit: 5
