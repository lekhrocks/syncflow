server:
  port: 8080

spring:
  application:
    name: syncflow
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/syncflow
    username: syncflow
    password: syncflow
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] [%X{correlationId}] [%X{pipelineId}] %-5level %logger{36} - %msg%n"
  level:
    com.syncflow: INFO
    org.springframework: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,shutdown
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: true
    shutdown:
      enabled: false   # endpoint is listed so Spring maps it (→ 404/405), but never executes
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  prometheus:
    metrics:
      export:
        enabled: true
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

syncflow:
  # Runtime tunables (queue/retry/poll constants). Bound to
  # @ConfigurationProperties("syncflow.runtime") + @Validated on RuntimeProperties.
  # Each value is env-overridable with its default inline — same pattern as the
  # blocks below. Set e.g. SYNCFLOW_RUNTIME_SYNC_QUEUE_CAPACITY to override at deploy time.
  runtime:
    sync:
      # Per-pipeline in-memory CDC event queue capacity (events). Raise under
      # bursts so the worker drains in larger batches instead of dropping events.
      queue-capacity: ${SYNCFLOW_RUNTIME_SYNC_QUEUE_CAPACITY:10000}
      # Max events drained + written per batched DB call.
      batch-size: ${SYNCFLOW_RUNTIME_SYNC_BATCH_SIZE:100}
      # Poll timeout when the queue is empty before looping again.
      poll-timeout: ${SYNCFLOW_RUNTIME_SYNC_POLL_TIMEOUT:500ms}
    snapshot:
      # Persist a cursor checkpoint every N batches so resume continues at the
      # next row instead of re-reading from the start.
      checkpoint-interval-batches: ${SYNCFLOW_RUNTIME_SNAPSHOT_CHECKPOINT_INTERVAL_BATCHES:5}
    retry:
      # Max delivery attempts per event before it's sent to the dead-letter queue.
      max-attempts: ${SYNCFLOW_RUNTIME_RETRY_MAX_ATTEMPTS:3}
      # Exponential-backoff base delay; doubles per retry (1s, 2s, 4s, ...).
      base-delay: ${SYNCFLOW_RUNTIME_RETRY_BASE_DELAY:1000ms}
  pipeline:
    max-name-length: 255
    default-status: CREATED
  connector:
    connection-timeout: 30s
    retry-count: 3
  metadata:
    cache-ttl: 5m
    sample-size: 100
  encryption:
    # Required. Base64-encoded AES key (16/24/32 bytes). No default — a missing
    # or invalid key fails fast at startup via EncryptionService.
    key: ${SYNCFLOW_ENCRYPTION_KEY:}
  jwt:
    # Required. Base64-encoded HMAC secret (>= 32 bytes). No default — a missing
    # or invalid secret fails fast at startup via JwtSecurityConfig.
    secret: ${SYNCFLOW_JWT_SECRET:}
    issuer: ${SYNCFLOW_JWT_ISSUER:syncflow}
    expiry-minutes: ${SYNCFLOW_JWT_EXPIRY_MINUTES:60}
  ai:
    endpoint: ${SYNCFLOW_AI_ENDPOINT:https://api.openai.com/v1/chat/completions}
    model: ${SYNCFLOW_AI_MODEL:gpt-4o}
    api-key: ${SYNCFLOW_AI_API_KEY:}
    max-tokens: 4096
    temperature: 0.3
  kafka:
    enabled: ${SYNCFLOW_KAFKA_ENABLED:false}
    bootstrap-servers: ${SYNCFLOW_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    topic:
      prefix: ${SYNCFLOW_KAFKA_TOPIC_PREFIX:syncflow}
      partitions: ${SYNCFLOW_KAFKA_TOPIC_PARTITIONS:3}
      replication-factor: ${SYNCFLOW_KAFKA_TOPIC_REPLICATION_FACTOR:1}
      retention-ms: ${SYNCFLOW_KAFKA_TOPIC_RETENTION_MS:604800000}  # 7 days
    producer:
      acks: all
      retries: 3
      batch-size: 65536
      linger-ms: 5
      compression-type: snappy
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: ${SYNCFLOW_KAFKA_CONSUMER_GROUP:syncflow-consumer}
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 500
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
