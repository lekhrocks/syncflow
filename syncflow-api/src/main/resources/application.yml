server:
  port: 8080

spring:
  application:
    name: syncflow
  datasource:
    url: jdbc:postgresql://localhost:5432/syncflow
    username: syncflow
    password: syncflow
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] [%X{correlationId}] [%X{pipelineId}] %-5level %logger{36} - %msg%n"
  level:
    com.syncflow: INFO
    org.springframework: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,shutdown
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: true
    shutdown:
      enabled: false   # endpoint is listed so Spring maps it (→ 404/405), but never executes
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  prometheus:
    metrics:
      export:
        enabled: true
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

syncflow:
  pipeline:
    max-name-length: 255
    default-status: CREATED
  connector:
    connection-timeout: 30s
    retry-count: 3
  metadata:
    cache-ttl: 5m
    sample-size: 100
  encryption:
    # 16-byte AES key, base64-encoded. Replace in production with a secure key.
    key: MDEyMzQ1Njc4OWFiY2RlZg==
  jwt:
    # Base64-encoded HMAC secret (HS256). Replace in production with a 32+ byte key.
    secret: ${SYNCFLOW_JWT_SECRET:c3luY2Zsb3ctaHMyNTYtand0LXNlY3JldC1rZXktMjAyNi1jaGFuZ2UtaW4tcHJvZA==}
    issuer: ${SYNCFLOW_JWT_ISSUER:syncflow}
    expiry-minutes: ${SYNCFLOW_JWT_EXPIRY_MINUTES:60}
  ai:
    endpoint: ${SYNCFLOW_AI_ENDPOINT:https://api.openai.com/v1/chat/completions}
    model: ${SYNCFLOW_AI_MODEL:gpt-4o}
    api-key: ${SYNCFLOW_AI_API_KEY:}
    max-tokens: 4096
    temperature: 0.3
  kafka:
    enabled: ${SYNCFLOW_KAFKA_ENABLED:false}
    bootstrap-servers: ${SYNCFLOW_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    topic:
      prefix: ${SYNCFLOW_KAFKA_TOPIC_PREFIX:syncflow}
      partitions: ${SYNCFLOW_KAFKA_TOPIC_PARTITIONS:3}
      replication-factor: ${SYNCFLOW_KAFKA_TOPIC_REPLICATION_FACTOR:1}
      retention-ms: ${SYNCFLOW_KAFKA_TOPIC_RETENTION_MS:604800000}  # 7 days
    producer:
      acks: all
      retries: 3
      batch-size: 65536
      linger-ms: 5
      compression-type: snappy
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: ${SYNCFLOW_KAFKA_CONSUMER_GROUP:syncflow-consumer}
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 500
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
