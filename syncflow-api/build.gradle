plugins {
    id "java"
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
}

// GHSA-mhm7-754m-9p8w: jackson-databind @JsonView bypass. Spring Boot 3.5.16's
// BOM pins jackson-bom 2.21.4 (vulnerable). Re-import the Jackson BOM at the
// patched 2.21.5 AFTER Spring Boot's BOM so the later import wins.
dependencyManagement {
    imports {
        mavenBom "com.fasterxml.jackson:jackson-bom:2.21.5"
    }
}

dependencies {
    implementation project(":syncflow-core")
    implementation project(":syncflow-connectors")
    implementation project(":syncflow-security")
    implementation project(":syncflow-monitoring")
    implementation project(":syncflow-plugin-api")

    implementation libs.spring.boot.starter.web
    implementation libs.spring.boot.starter.validation
    implementation libs.spring.boot.starter.data.jpa

    implementation libs.spring.boot.starter.actuator
    implementation libs.spring.boot.starter.security
    implementation libs.spring.security.oauth2.jose
    implementation libs.spring.security.oauth2.resource.server
    implementation libs.spring.doc.openapi.starter.webmvc.ui
    implementation libs.kafka.clients
    implementation libs.flyway.core
    implementation libs.flyway.database.postgresql
    implementation libs.postgresql
    implementation libs.micrometer.registry.prometheus
    implementation libs.logback.classic
    implementation libs.mapstruct
    implementation "com.github.ben-manes.caffeine:caffeine:3.2.0"
    // CVE-2025-48924: Spring Boot 3.5.16's BOM pins commons-lang3 3.17.0
    // (vulnerable). Declare it directly at the patched 3.18.0 to override it.
    implementation "org.apache.commons:commons-lang3:3.18.0"

    compileOnly libs.lombok
    annotationProcessor libs.lombok
    annotationProcessor libs.mapstruct.processor

    testImplementation(libs.spring.boot.starter.test) {
        exclude group: "org.junit.vintage", module: "junit-vintage-engine"
    }
    testImplementation libs.testcontainers.postgresql
    testImplementation libs.testcontainers.kafka
    testImplementation libs.testcontainers.junit.jupiter
    testImplementation libs.awaitility
    testImplementation libs.archunit.junit5
    testImplementation "io.rest-assured:rest-assured:5.5.1"
    testImplementation "org.skyscreamer:jsonassert:1.5.3"
}
