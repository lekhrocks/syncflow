plugins {
    id "java-library"
}

dependencies {
    implementation project(":syncflow-core")
    // Connectors are Spring @Components (stereotype + DisposableBean) discovered
    // by the api's context. Previously inherited transitively from syncflow-core,
    // which no longer carries Spring — declare it here directly.
    implementation "org.springframework:spring-context:6.2.6"
    implementation libs.lombok
    implementation libs.postgresql
    implementation libs.mysql.connector.j
    implementation libs.mongodb.driver.sync
    implementation libs.debezium.embedded
    implementation libs.debezium.connector.postgres
    implementation libs.debezium.connector.mysql

    implementation libs.kafka.clients
    implementation libs.hikari

    annotationProcessor libs.lombok

    testImplementation libs.junit.jupiter
    testImplementation libs.junit.platform.launcher
    testImplementation libs.mockito.core
    testImplementation libs.mockito.junit.jupiter
    testImplementation libs.testcontainers.postgresql
    testImplementation libs.testcontainers.junit.jupiter
    testImplementation "org.testcontainers:mysql:1.20.6"
    testImplementation "org.testcontainers:mongodb:1.20.6"
}

tasks.named("jar") { enabled = true }
